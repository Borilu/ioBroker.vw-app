name: Timer fix isolated Linux validation
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/timer-fix-*'
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate package and adapter source
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform')" = linux
          npm run check
          npm run lint
      - name: Run synthetic unit, timer editor, native parity and crash/restart tests
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME/bin/javac"
          export VW_EDITOR_JDK_HOME="$JAVA_HOME"
          npm run test:unit
      - name: Verify Linux fence survives a real killed owner process
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform')" = linux
          node --test test/execution-fence.test.js test/execution-fence-crash.test.js
      - name: Run official ioBroker package and fresh-installation harness
        run: |
          set -euo pipefail
          npm run test:package
          npm run test:integration
