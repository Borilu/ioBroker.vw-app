name: Test and Release

on:
  push:
    branches: ['*', '**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          lint: true
      - name: Check adapter metadata, package boundaries and Android helper integrity
        run: npm run check
      - name: Inspect the npm package
        run: npm pack --dry-run

  adapter-tests:
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
        os: [ubuntu-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  deploy:
    needs: [check-and-lint, adapter-tests]
    if: >-
      github.repository == 'Borilu/ioBroker.vw-app' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'
      - name: Verify the release tag and check for an existing npm version
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'iobroker.vw-app' || process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('The release tag must exactly match this adapter package version.');
          }
          execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main']);
          const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`;
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(15000) });
          let publish;
          if (response.status === 404) {
            publish = true;
          } else if (response.status === 200) {
            const remote = await response.json();
            if (remote.name !== pkg.name || remote.version !== pkg.version) {
              throw new Error('The npm registry returned a different package or version.');
            }
            publish = false;
          } else {
            throw new Error(`The npm registry check failed with HTTP ${response.status}.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`);
          if (!publish) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              'This exact npm version already exists. It is kept unchanged; no duplicate publish is attempted.\n');
          }
          NODE
      # The first package is published interactively. Later new versions use
      # this OIDC path only after the owner configures npm trusted publishing
      # for Borilu/ioBroker.vw-app and this workflow. No npm token is stored here.
      - uses: ioBroker/testing-action-deploy@v1
        if: steps.registry.outputs.publish == 'true'
        with:
          node-version: '24.x'
          github-token: ${{ secrets.GITHUB_TOKEN }}
