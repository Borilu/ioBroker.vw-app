name: WIP editor-free reading tests

on:
  push:
    branches:
      - wip/editorless-isolated-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wip-editorless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'Borilu/ioBroker.vw-app' && github.ref == 'refs/heads/wip/editorless-isolated-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check package boundaries
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Package tests
        run: npm run test:package
      - name: Official ioBroker integration harness
        run: npm run test:integration
