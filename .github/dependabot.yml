version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    ignore:
      # Match the oldest supported Node.js release until support is reviewed.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
